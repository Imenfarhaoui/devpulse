services:
  postgres:
    image: postgres:17-alpine
    container_name: devpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devpulse_db
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse_local_password
    ports:
      - "5432:5432"
    volumes:
      - devpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse -d devpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  devpulse_postgres_data:
